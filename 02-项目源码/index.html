<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字分身画像馆</title>
    <style>
      /* Pre-paint fallback: dark museum background even before CSS/JS arrive */
      html, body {
        margin: 0;
        background: #07080c;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #e8ddc4;
        font-family: "Noto Serif SC", "Songti SC", serif;
        text-align: center;
        padding: 24px;
        background: #07080c;
        z-index: 9999;
      }
      #boot-fallback .t {
        font-size: 26px;
        letter-spacing: 0.3em;
        margin-bottom: 14px;
        color: #ecc98a;
      }
      #boot-fallback .s {
        font-size: 13px;
        opacity: 0.6;
        line-height: 1.9;
        max-width: 460px;
      }
      #boot-fallback button {
        margin-top: 26px;
        background: transparent;
        color: #ecc98a;
        border: 1px solid rgba(236, 201, 138, 0.5);
        padding: 10px 30px;
        font-size: 13px;
        letter-spacing: 0.14em;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
    <!-- Async web fonts: page renders immediately with local serif fallbacks,
         fonts swap in when (and only if) they load — never blocks first paint -->
    <script>
      (function () {
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href =
          "https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap";
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Boot fallback: if the app bundle fails to load or crashes before
         first paint, show a graceful message instead of a blank page -->
    <div id="boot-fallback">
      <div class="t">数字分身画像馆</div>
      <div class="s" id="boot-msg">
        展厅正在准备中……如果一直停留在这里，请刷新页面。
      </div>
      <button onclick="location.reload(true)">重新加载</button>
    </div>

    <script>
      (function () {
        var shown = false;
        var lastErr = "";
        function show(msg) {
          if (shown) return;
          // only show if the app truly failed to mount
          var root = document.getElementById("root");
          if (root && root.innerHTML.length > 10) return;
          shown = true;
          var f = document.getElementById("boot-fallback");
          if (msg) document.getElementById("boot-msg").textContent = msg;
          else if (lastErr) document.getElementById("boot-msg").textContent = lastErr;
          if (f) f.style.display = "flex";
        }
        // app crashed / failed to start
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") {
            lastErr = "脚本加载失败: " + (e.target.src || "未知") ;
            show(lastErr);
          }
        }, true);
        window.addEventListener("unhandledrejection", function () {
          // don't panic on rejections; only the watchdog decides
        });
        // watchdog: if nothing rendered after 12s, show the fallback
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.innerHTML.length > 10) return;
          show("加载超时。展厅资源较多，请刷新重试。");
        }, 12000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
